[package]
name = "horizon-narrator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "The narrator: vanilla's text-to-speech (GameNarrator, com.mojang.text2speech) and screen narration state"

[dependencies]
log = "0.4"

# NarratorWindows: SAPI's SpVoice over COM, the voice the Windows narrator settings pick.
[target.'cfg(windows)'.dependencies]
# 0.54, not 0.62: windows-core 0.62 links CoTaskMemAlloc and its kind against combase.dll
# (Windows 8's), which a Windows 7 build then cannot even load — 0.54 binds them to ole32,
# which Windows 7 has. cpal already carries the 0.54 line, so this adds no dependency.
windows = { version = "0.54.0", features = ["Win32_Foundation", "Win32_Media_Speech", "Win32_System_Com"] }

# NarratorLinux: flite and its cmu_us_kal16 voice, opened at run time as JNA does.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"

# NarratorMac: AppKit's NSSpeechSynthesizer, the voice of the system's spoken content settings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSpeechSynthesizer"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString"] }

[lints]
workspace = true
